name: Build signed release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STREAMHUB_KEYSTORE_PATH: ${{ github.workspace }}/.release-signing/streamhub.p12
      STREAMHUB_STORE_PASSWORD: ${{ secrets.STREAMHUB_STORE_PASSWORD }}
      STREAMHUB_KEY_ALIAS: ${{ secrets.STREAMHUB_KEY_ALIAS }}
      STREAMHUB_KEY_PASSWORD: ${{ secrets.STREAMHUB_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14
      - name: Load private release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STREAMHUB_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STREAMHUB_STORE_PASSWORD" || -z "$STREAMHUB_KEY_ALIAS" || -z "$STREAMHUB_KEY_PASSWORD" ]]; then
            echo "Missing STREAMHUB signing secrets. Run tools/setup-release-termux.sh first."
            exit 1
          fi
          umask 077
          mkdir -p .release-signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$STREAMHUB_KEYSTORE_PATH"
      - name: Build optimized release
        run: gradle :app:assembleRelease :ext-archive:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: StreamHub-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@v4
        with:
          name: optional-archive-extension
          path: ext-archive/build/outputs/apk/debug/ext-archive-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: stable-latest
          name: StreamHub release build
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/release/app-release.apk
      - name: Remove signing material
        if: always()
        run: rm -rf .release-signing
